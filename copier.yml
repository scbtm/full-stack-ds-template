# MLOps Template Blueprint - Copier Configuration
_min_copier_version: "9.0.0"
_subdirectory: template

# Template metadata
_templates_suffix: .jinja
_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
  comment_start_string: "{#"
  comment_end_string: "#}"

# User customization questions
project_slug:
  type: str
  help: "Repository/Docker image name (kebab-case, e.g., 'my-ml-project')"
  validator: "{% if not project_slug.replace('-', '').replace('_', '').isalnum() %}Invalid project slug. Use only letters, numbers, hyphens, and underscores.{% endif %}"

package_name:
  type: str
  help: "Python package name under src/ (snake_case, e.g., 'my_ml_project')"
  default: "{{ project_slug.replace('-', '_') }}"
  validator: "{% if not package_name.replace('_', '').isalnum() %}Invalid package name. Use only letters, numbers, and underscores.{% endif %}"

# Fixed template configuration - not prompted to user
python_version:
  type: str
  default: "3.12"
  when: false

include_sample_code:
  type: str
  default: "starter"
  when: false

include_feature_engineering:
  type: bool
  default: true
  when: false

ci_provider:
  type: str
  default: "github_actions"
  when: false

cloud_provider:
  type: str
  default: "gcp"
  when: false

include_monitoring:
  type: bool
  default: true
  when: false

api_framework:
  type: str
  default: "fastapi"
  when: false

# Files to exclude based on configuration
_skip_if_exists:
  - "*.py"

_tasks:
  - command: |
      echo "Setting up your MLOps project..."
      if ! command -v uv >/dev/null 2>&1; then
        echo "Installing uv package manager..."
        if command -v pipx >/dev/null 2>&1; then
          pipx install uv
        elif command -v pip >/dev/null 2>&1; then
          pip install --user pipx
          export PATH="$HOME/.local/bin:$PATH"
          pipx install uv
        else
          echo "Installing uv via curl..."
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
        fi
      fi
    when: true
  - command: |
      echo "Installing project dependencies..."
      export PATH="$HOME/.local/bin:$PATH"
      uv sync --all-groups
    when: true
  - command: "echo 'Template generated successfully! Run make verify to test your setup.'"
    when: true