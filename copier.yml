# MLOps Template Blueprint - Copier Configuration
_min_copier_version: "9.0.0"
_subdirectory: template

# Template metadata
_templates_suffix: .jinja
_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
  comment_start_string: "{#"
  comment_end_string: "#}"

# User customization questions
project_slug:
  type: str
  help: "Repository/Docker image name (kebab-case, e.g., 'my-ml-project')"
  validator: "{% if not project_slug.replace('-', '').replace('_', '').isalnum() %}Invalid project slug. Use only letters, numbers, hyphens, and underscores.{% endif %}"

package_name:
  type: str
  help: "Python package name under src/ (snake_case, e.g., 'my_ml_project')"
  default: "{{ project_slug.replace('-', '_') }}"
  validator: "{% if not package_name.replace('_', '').isalnum() %}Invalid package name. Use only letters, numbers, and underscores.{% endif %}"

# Fixed template configuration - not prompted to user
python_version:
  type: str
  default: "3.12"
  when: false

# Files to exclude based on configuration
_skip_if_exists:
  - "*.py"

_tasks:
  - command: |
      echo "Setting up your project..."

      # Ensure PATH includes pipx installation location
      export PATH="$HOME/.local/bin:$PATH"

      # Check if uv is available
      if ! command -v uv >/dev/null 2>&1; then
        echo "Installing uv package manager..."

        # Check if pipx is available
        if ! command -v pipx >/dev/null 2>&1; then
          echo "Error: pipx is required to install uv."
          echo "Please install pipx first:"
          echo "  pip install --user pipx"
          echo "  pipx ensurepath"
          echo "Then run the template generation again."
          exit 1
        fi

        # Install uv via pipx
        echo "Installing uv via pipx..."
        if pipx install uv; then
          echo "uv installed successfully via pipx"
        else
          echo "Error: Failed to install uv via pipx"
          exit 1
        fi
      else
        echo "uv is already available"
      fi

      # Verify uv is working
      if command -v uv >/dev/null 2>&1; then
        echo "uv version: $(uv --version)"
      else
        echo "Error: uv installation failed"
        exit 1
      fi
  - command: "echo 'Template generated successfully! Dependencies will be installed during initialization.'"